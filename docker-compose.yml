services:
  rabbitmq:
    image: rabbitmq:3.13-management
    user: "999:999"
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  transaction-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    volumes:
      - transaction-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d transactions"]
      interval: 5s
      timeout: 5s
      retries: 20

  analysis-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analyses
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5434:5432"
    volumes:
      - analysis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d analyses"]
      interval: 5s
      timeout: 5s
      retries: 20

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://transaction-db:5432/transactions
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: app
      SPRING_RABBITMQ_PASSWORD: app
    ports:
      - "8081:8081"
    depends_on:
      transaction-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  analysis-service:
    build:
      context: .
      dockerfile: analysis-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://analysis-db:5432/analyses
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: app
      SPRING_RABBITMQ_PASSWORD: app
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8082:8082"
    depends_on:
      analysis-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  rabbitmq-data:
  transaction-data:
  analysis-data:
